<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Crazy Balls Duel</title>
  <!-- SDK do Poki no <head>, como pede a documentação (sem ele o jogo funciona igual, só sem anúncios) -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="tela">
    <canvas id="canvas" width="1280" height="720"></canvas>

    <!-- HUD por cima do jogo -->
    <div id="hud" class="escondido">
      <button id="btnPausa" class="hudBotao" data-acao="pausar" aria-label="pause">II</button>
    </div>

    <!-- Menu principal (a luta de demonstração roda no fundo) -->
    <div id="telaMenu" class="tela">
      <div class="moedas" id="menuMoedas"></div>
      <div class="nivelJogador"><span id="menuNivelNum"></span><div class="barraXp"><div id="menuXp"></div></div></div>
      <h1 data-t="titulo"></h1>
      <p class="resultado" id="menuResultado"></p>
      <div class="botoes">
        <button class="grande" data-acao="jogar" data-t="jogar"></button>
        <div class="linha">
          <button data-acao="missoes"><span data-t="missoes"></span><span class="selo escondido" id="seloMissoes"></span></button>
          <button data-acao="skins" data-t="skins"></button>
          <button data-acao="opcoes" data-t="opcoes"></button>
        </div>
      </div>
    </div>

    <!-- Opções -->
    <div id="telaOpcoes" class="tela">
      <h2 data-t="opcoes"></h2>
      <div class="botoes">
        <button data-acao="idiomas" data-t="idioma"></button>
        <button data-acao="som" id="btnSom"></button>
        <button data-acao="controles" data-t="controles"></button>
        <button data-acao="qualidade" id="btnQualidade"></button>
        <button data-acao="voltar" data-t="voltar"></button>
      </div>
    </div>

    <!-- Troca de teclas -->
    <div id="telaControles" class="tela">
      <h2 data-t="controles"></h2>
      <div id="gradeTeclas"></div>
      <p class="info pequena" data-t="controles_mouse"></p>
      <div class="linha">
        <button data-acao="teclasPadrao" data-t="teclas_padrao"></button>
        <button data-acao="voltarOpcoes" data-t="voltar"></button>
      </div>
    </div>

    <!-- Missões, desafios da semana e conquistas -->
    <div id="telaMissoes" class="tela painel">
      <div class="topo">
        <div class="abas">
          <button data-aba="missoes" data-t="missoes"></button>
          <button data-aba="semana" data-t="semana"></button>
          <button data-aba="conquistas" data-t="conquistas"></button>
        </div>
        <div class="moedas" id="missoesMoedas"></div>
      </div>
      <div class="lista" id="listaMissoes"></div>
      <button data-acao="voltar" data-t="voltar"></button>
    </div>

    <!-- Skins: guarda-roupa e loja -->
    <div id="telaSkins" class="tela painel">
      <div class="topo">
        <div class="abas">
          <button data-aba="corpo" data-t="skins_corpo"></button>
          <button data-aba="acessorio" data-t="skins_acessorio"></button>
        </div>
        <div class="moedas" id="skinsMoedas"></div>
      </div>
      <div class="loja">
        <div class="previa"><canvas id="previaSkin" width="300" height="300"></canvas><p id="previaNome"></p></div>
        <div class="grade" id="gradeSkins"></div>
      </div>
      <button data-acao="voltar" data-t="voltar"></button>
    </div>

    <!-- Escolha do modo: contra o bot ou 2 jogadores -->
    <div id="telaModo" class="tela">
      <h2 data-t="escolha_modo"></h2>
      <div class="modos">
        <button class="modo" data-acao="modoBot">
          <span class="icone">🤖</span>
          <span class="nome" data-t="contra_bot"></span>
          <span class="dica" id="dicaBot"></span>
        </button>
        <button class="modo" data-acao="modo2p">
          <span class="icone">👥</span>
          <span class="nome" data-t="dois_jogadores"></span>
          <span class="selo" data-t="mesmo_aparelho"></span>
          <span class="dica" id="dica2p"></span>
        </button>
        <button class="modo surv" data-acao="modoSurv">
          <span class="icone">🔥</span>
          <span class="nome" data-t="sobrevivencia"></span>
          <span class="dica" id="dicaSurv"></span>
        </button>
      </div>
      <button class="premiado" data-acao="lendaria" id="btnLendaria"></button>
      <button data-acao="voltar" data-t="voltar" id="btnVoltarModo"></button>
    </div>

    <!-- Escolha do idioma (cada idioma com o nome na própria língua) -->
    <div id="telaIdiomas" class="tela">
      <h2 data-t="idioma"></h2>
      <div id="listaIdiomas"></div>
      <button data-acao="voltarOpcoes" data-t="voltar"></button>
    </div>

    <!-- Pausa -->
    <div id="telaPausa" class="tela">
      <h2 data-t="pausado"></h2>
      <div class="botoes">
        <button class="grande" data-acao="continuar" data-t="continuar"></button>
        <button data-acao="som" id="btnSomPausa"></button>
        <button data-acao="sair" data-t="menu"></button>
      </div>
    </div>

    <!-- Fim da partida: XP, baú e revanche -->
    <div id="telaRecompensa" class="tela">
      <h2 id="recTitulo"></h2>
      <p class="resultado" id="recSub"></p>
      <div class="xpLinha"><span id="recNivel"></span><div class="barraXp grande"><div id="recXp"></div></div><span id="recXpTxt"></span></div>
      <canvas id="canvasBau" width="460" height="290"></canvas>
      <p class="premioTxt" id="recPremio"></p>
      <div class="linha">
        <button class="grande" data-acao="abrirBau" id="btnAbrirBau"></button>
        <button class="premiado" data-acao="outroBau" id="btnOutroBau"></button>
      </div>
      <div class="linha">
        <button class="grande" data-acao="revanche" id="btnRevanche"></button>
        <button data-acao="recMenu" data-t="menu"></button>
      </div>
    </div>

    <!-- Recompensa diária -->
    <div id="telaDiaria" class="tela">
      <h2 data-t="diaria"></h2>
      <p class="info pequena" data-t="diaria_explica"></p>
      <div id="gradeDiaria"></div>
      <canvas id="canvasDiaria" width="320" height="200" class="escondido"></canvas>
      <p class="premioTxt" id="diariaPremio"></p>
      <button class="grande" data-acao="pegarDiaria" id="btnPegarDiaria" data-t="pegar"></button>
      <button data-acao="fecharDiaria" id="btnFecharDiaria" data-t="fechar"></button>
    </div>

    <!-- Perdeu para o bot: oferta opcional de continuar assistindo um anúncio -->
    <div id="telaContinuar" class="tela">
      <h2 data-t="bot_venceu"></h2>
      <p class="info" id="contPlacar"></p>
      <div class="botoes">
        <button class="premiado grande" data-acao="continuarPartida" data-t="continuar_anuncio"></button>
        <p class="info pequena" id="contExplica"></p>
        <button data-acao="naoContinuar" data-t="nao_obrigado"></button>
      </div>
      <p class="aviso" id="contAviso"></p>
    </div>
  </div>

  <script src="js/nucleo/config.js"></script>
  <script src="js/nucleo/util.js"></script>
  <script src="js/idiomas/idiomas.js"></script>
  <script src="js/nucleo/save.js"></script>
  <script src="js/poki/poki.js"></script>
  <script src="js/poki/eventos.js"></script>
  <script src="js/sistemas/audio.js"></script>
  <script src="js/sistemas/entrada.js"></script>
  <script src="js/jogo/dados/armas.js"></script>
  <script src="js/jogo/dados/cenarios.js"></script>
  <script src="js/jogo/dados/cartas.js"></script>
  <script src="js/jogo/dados/skins.js"></script>
  <script src="js/jogo/arte/efeitos.js"></script>
  <script src="js/jogo/arte/skins.js"></script>
  <script src="js/jogo/arte/bolinhas.js"></script>
  <script src="js/jogo/arte/armas.js"></script>
  <script src="js/jogo/arte/cartas.js"></script>
  <script src="js/jogo/arte/cenarios.js"></script>
  <script src="js/jogo/arte/queda.js"></script>
  <script src="js/jogo/arte/bau.js"></script>
  <script src="js/jogo/motor/fisica.js"></script>
  <script src="js/jogo/motor/combate.js"></script>
  <script src="js/jogo/motor/bot.js"></script>
  <script src="js/jogo/motor/partida.js"></script>
  <script src="js/jogo/progresso/dados.js"></script>
  <script src="js/jogo/progresso/progresso.js"></script>
  <script src="js/jogo/desenho.js"></script>
  <script src="js/interface/telas.js"></script>
  <script src="js/interface/menus.js"></script>
  <script src="js/interface/recompensa.js"></script>
  <script src="js/nucleo/main.js"></script>
</body>
</html>
