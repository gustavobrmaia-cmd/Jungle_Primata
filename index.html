<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo do Primata</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: monospace;
    }

    /* O jogo tem 1200x700 "pixels de jogo" e é escalado para caber na janela */
    #jogo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1200px;
      height: 700px;
      transform: translate(-50%, -50%);
    }

    #tela {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    button {
      font: bold 16px monospace;
      cursor: pointer;
      border: 3px solid #3b2412;
      background: #ffcf2e;
      color: #3b2412;
      padding: 6px 12px;
      box-shadow: 0 4px 0 #3b2412;
    }

    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #3b2412; }
    button:disabled { cursor: default; background: #8a8a8a; color: #2a2a2a; }

    #btnLoja {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 20px;
    }

    .ic-moeda {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 4px;
      vertical-align: -2px;
      background: #ffcf2e;
      border: 2px solid #b8740a;
      border-radius: 50%;
    }

    /* ===== LOJA ===== */
    #loja {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      color: white;
    }

    #loja.aberta { display: flex; }

    .painel {
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: auto 1fr;
      gap: 16px;
      width: 1040px;
      height: 600px;
      padding: 20px;
      background: #5a3a1c;
      border: 6px solid #3b2412;
      box-shadow: 0 0 0 4px #8a5a2b;
    }

    .topo {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .topo h2 { font-size: 30px; color: #ffcf2e; text-shadow: 3px 3px 0 #3b2412; }
    .topo .saldo { font-size: 24px; font-weight: bold; }
    .topo .dica { flex: 1; text-align: right; color: #e8c08a; font-size: 14px; }

    .lado {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #previa {
      width: 200px;
      height: 200px;
      image-rendering: pixelated;
      background: #3b2412;
      border: 4px solid #8a5a2b;
    }

    .abas { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .abas button { width: 100%; background: #c79a62; }
    .abas button.ativa { background: #ffcf2e; }

    .itens {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      align-content: start;
      overflow-y: auto;
      padding-right: 6px;
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px;
      background: #3b2412;
      border: 3px solid #8a5a2b;
    }

    .item.equipado { border-color: #6fcf3a; }

    .item canvas {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
    }

    .item .nome { font-weight: bold; font-size: 16px; }
    .item .preco { font-size: 14px; color: #ffcf2e; min-height: 18px; }
    .item button { width: 100%; font-size: 14px; }
  </style>
</head>

<body>

  <div id="jogo">

    <canvas id="tela" width="1200" height="700"></canvas>

    <button id="btnLoja" tabindex="-1">LOJA (L)</button>

    <div id="loja">
      <div class="painel">
        <div class="topo">
          <h2>Loja do Primata</h2>
          <span class="saldo"><span class="ic-moeda"></span><span id="lojaMoedas">0</span></span>
          <span class="dica">L ou Esc para voltar ao jogo</span>
          <button id="fecharLoja" tabindex="-1">X</button>
        </div>

        <div class="lado">
          <canvas id="previa" width="160" height="160"></canvas>
          <div class="abas" id="abas"></div>
        </div>

        <div class="itens" id="itens"></div>
      </div>
    </div>

  </div>


  <script>
    "use strict";

    // =========================
    // CONFIGURAÇÕES
    // =========================

    const LARGURA = 1200;
    const ALTURA = 700;
    const PASSO = 1000 / 60;   // física roda sempre a 60 passos por segundo (igual em qualquer monitor)
    const PARALAXE = 0.5;      // fundo anda mais devagar que o mundo

    const FUNDO_URL = "https://static.vecteezy.com/ti/vetor-gratis/p1/48518715-8-mordeu-pixel-arte-selva-floresta-jogos-nivel-panorama-vetor.jpg";

    // Sua imagem do macaco: vira a skin "Original" na loja (se não carregar, a skin some).
    // As roupas são desenhadas para o macaco pixelado, então na sua imagem podem não encaixar perfeito.
    const IMAGEM_PERSONAGEM = "file:///C:/Users/info19/Documents/Captura_de_tela_2026-08-20_150440-removebg-preview.png";

    // Moeda: por padrão usa uma moeda pixelada feita no código (6 quadros).
    // Para usar seu PNG: imagem: "moeda.png", frames: quadros na faixa horizontal
    const MOEDA = { imagem: "", frames: 6, tamanho: 32 };

    const SAVE_KEY = "primata-save-v1";


    // =========================
    // MACACO EM PIXEL ART (grade 20x20, cada pixel vira 4x4 na tela = 80x80)
    // D contorno, F pelo, P pele, B barriga, W/E olho, M boca
    // =========================

    const CORPO = [
      "....................",
      "....................",
      "....................",
      ".......DDDDDD.......",
      ".....DDFFFFFFDD.....",
      "....DFFFFFFFFFFD....",
      ".DD.DFFFFFFFFFFD.DD.",
      "DPPDFFPPPPPPPPFFDPPD",
      "DPPDFPWEPPPPWEPFDPPD",
      ".DDDFPWEPPPPWEPFDDD.",
      "...DFPPPPPPPPPPFD...",
      "....DFPPMMMMPPFD....",
      ".....DFPPPPPPFD.....",
      "......DDDDDDDD......",
      ".....DFFBBBBFFD.....",
      "....DFFBBBBBBFFD..D.",
      "...DPDFBBBBBBFDPD..D",
      "...DPDFFBBBBFFDPD..D",
      ".....DFFFFFFFFDDDDD.",
      ".....DPPD..DPPD....."
    ];

    const CORES_BASE = { E: "#111111", W: "#ffffff", M: "#6b2a1a" };

    const SKINS = [
      { id: "classico", nome: "Clássico", preco: 0,
        cores: { F: "#8a5a2b", D: "#3b2412", P: "#e8c08a", B: "#c79a62" } },
      { id: "dourado", nome: "Dourado", preco: 15,
        cores: { F: "#e0a526", D: "#6e4504", P: "#fff0c2", B: "#ffd166" } },
      { id: "gelo", nome: "Gelo", preco: 20,
        cores: { F: "#e8f1f8", D: "#4a6a8a", P: "#a8d8ff", B: "#ffffff", E: "#1b3a5c" } },
      { id: "sombra", nome: "Sombra", preco: 25,
        cores: { F: "#3a2f4a", D: "#0e0914", P: "#a08cc0", B: "#5d4b78", E: "#ff3b6b", W: "#ffd1dc" } },
      { id: "fogo", nome: "Fogo", preco: 30,
        cores: { F: "#d9480f", D: "#5c1a03", P: "#ffd8a8", B: "#ffa94d" } },
      { id: "zumbi", nome: "Zumbi", preco: 35,
        cores: { F: "#5c8a3a", D: "#1f3312", P: "#b5d99c", B: "#8fbf6a", E: "#c92a2a", W: "#f8f9c8", M: "#3a1010" } }
    ];

    if (IMAGEM_PERSONAGEM) {
      SKINS.unshift({ id: "original", nome: "Original", preco: 0, imagem: true });
    }

    // Roupas: y = linha da grade onde o desenho começa
    const ITENS = [
      // Chapéus
      { id: "bone", tipo: "chapeu", nome: "Boné", preco: 5, y: 2,
        cores: { R: "#d62828", W: "#ffffff", K: "#7a1010" },
        mapa: [
          "......RRRRRRR.......",
          ".....RRRWRRRRR......",
          ".....KRRRRRRRRRRRR.."
        ] },
      { id: "festa", nome: "Chapéu de Festa", tipo: "chapeu", preco: 8, y: 0,
        cores: { W: "#ffffff", P: "#e64980", Y: "#ffd43b" },
        mapa: [
          ".........WW.........",
          "........PPPP........",
          ".......PYPPYP.......",
          "......PPPYYPPP......"
        ] },
      { id: "cartola", tipo: "chapeu", nome: "Cartola", preco: 15, y: 0,
        cores: { K: "#1a1a1a", R: "#c92a2a" },
        mapa: [
          "......KKKKKKKK......",
          "......KKKKKKKK......",
          "......RRRRRRRR......",
          "....KKKKKKKKKKKK...."
        ] },
      { id: "coroa", tipo: "chapeu", nome: "Coroa", preco: 30, y: 0,
        cores: { Y: "#ffd43b", R: "#e03131", O: "#c98a00" },
        mapa: [
          ".......Y.YY.Y.......",
          ".......YYRRYY.......",
          ".......YYYYYY.......",
          "......OOOOOOOO......"
        ] },

      // Óculos
      { id: "escuros", tipo: "oculos", nome: "Óculos Escuros", preco: 8, y: 8,
        cores: { K: "#111111", G: "#6c757d" },
        mapa: [
          "....KGKKKKKKGKKK....",
          "....KKKKK..KKKKK...."
        ] },
      { id: "oculos3d", tipo: "oculos", nome: "Óculos 3D", preco: 10, y: 8,
        cores: { K: "#f1f3f5", R: "#e03131", C: "#22b8cf" },
        mapa: [
          "....KRRRKKKKCCCK....",
          "....KRRRK..KCCCK...."
        ] },
      { id: "mascara", tipo: "oculos", nome: "Máscara", preco: 12, y: 8,
        cores: { K: "#5f3dc4" },
        mapa: [
          "...KKK..KKKK..KKK...",
          "....KK..KKKK..KK...."
        ] },

      // Roupas
      { id: "gravata", tipo: "roupa", nome: "Gravata", preco: 6, y: 13,
        cores: { W: "#ffffff", R: "#c92a2a" },
        mapa: [
          ".......WW..WW.......",
          ".........RR.........",
          ".........RR.........",
          "........RRRR........",
          ".........RR........."
        ] },
      { id: "camiseta", tipo: "roupa", nome: "Camiseta", preco: 10, y: 14,
        cores: { R: "#e03131", Y: "#ffd43b" },
        mapa: [
          "......RRRRRRRR......",
          ".....RRRRRRRRRR.....",
          "......RRRYYRRR......",
          "......RRRRRRRR......"
        ] },
      { id: "macacao", tipo: "roupa", nome: "Macacão", preco: 15, y: 14,
        cores: { U: "#1c7ed6", Y: "#ffd43b" },
        mapa: [
          ".......U....U.......",
          ".......YUUUUY.......",
          "......UUUUUUUU......",
          "......UUUUUUUU......",
          "......UUUUUUUU......"
        ] }
    ];

    const ABAS = [
      { tipo: "skin", nome: "Skins" },
      { tipo: "chapeu", nome: "Chapéus" },
      { tipo: "oculos", nome: "Óculos" },
      { tipo: "roupa", nome: "Roupas" }
    ];

    const CAMADAS = ["roupa", "oculos", "chapeu"]; // ordem de desenho por cima do corpo


    // =========================
    // FASES
    // plataformas: [x, y, largura]   moedas: [x, y]   fim: x da bandeira
    // (o pulo alcança uns 140px de altura: não deixe uma plataforma mais de ~110px acima da anterior)
    // =========================

    const fases = [
      {
        largura: 3000,
        fim: 2800,
        plataformas: [
          [600, 560, 150], [850, 470, 150], [1100, 380, 150], [1400, 470, 150],
          [1650, 560, 200], [1950, 450, 150], [2200, 350, 150], [2500, 450, 200]
        ],
        moedas: [
          [300, 610], [660, 510], [910, 420], [1160, 330], [1460, 420],
          [1740, 510], [2010, 400], [2260, 300], [2580, 400]
        ]
      },
      {
        largura: 4000,
        fim: 3800,
        plataformas: [
          [500, 560, 120], [720, 470, 120], [940, 380, 120], [1200, 300, 120],
          [1500, 380, 120], [1750, 470, 120], [2050, 560, 150], [2350, 470, 120],
          [2600, 380, 120], [2850, 300, 120], [3150, 400, 150], [3450, 500, 200]
        ],
        moedas: [
          [540, 510], [760, 420], [980, 330], [1240, 250], [1540, 330],
          [1790, 420], [2110, 510], [2390, 420], [2640, 330], [2890, 250],
          [3210, 350], [3530, 450]
        ]
      }
    ];


    // =========================
    // DESENHO EM PIXEL ART (tudo é pré-desenhado em canvas escondidos uma vez só)
    // =========================

    function criarCanvas(w, h) {
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      return c;
    }

    // Pinta um mapa de letras; junta pixels iguais vizinhos num retângulo só
    function pintarMapa(g, mapa, paleta, escala, dy) {
      dy = dy || 0;
      for (let y = 0; y < mapa.length; y++) {
        const linha = mapa[y];
        let x = 0;
        while (x < linha.length) {
          const cor = paleta[linha[x]];
          let fim = x + 1;
          while (fim < linha.length && linha[fim] === linha[x]) fim++;
          if (cor) {
            g.fillStyle = cor;
            g.fillRect(x * escala, (y + dy) * escala, (fim - x) * escala, escala);
          }
          x = fim;
        }
      }
    }

    const TILE = criarCanvas(32, 32);
    pintarMapa(TILE.getContext("2d"), [
      "GGGGGGGG",
      "gggggggg",
      "TggTTgTT",
      "TTTTTTTT",
      "TTdTTTTT",
      "TTTTTTdT",
      "TTTTddTT",
      "dddddddd"
    ], { G: "#6fcf3a", g: "#4caf2f", T: "#8a5a2b", d: "#6b4220" }, 4);

    function criarFaixa(largura) {
      const c = criarCanvas(largura, 32);
      const g = c.getContext("2d");
      for (let x = 0; x < largura; x += 32) g.drawImage(TILE, x, 0);
      return c;
    }

    const CHAO_Y = 670;
    const FAIXA_CHAO = criarFaixa(LARGURA + 32);

    const BANDEIRA = criarCanvas(40, 80);
    pintarMapa(BANDEIRA.getContext("2d"), [
      ".PRRRRR.", ".PRRRRR.", ".PRRRR..", ".PRRR...", ".PRR....",
      ".P......", ".P......", ".P......", ".P......", ".P......",
      ".P......", ".P......", ".P......", ".P......", ".P......", ".P......"
    ], { P: "#d8d8d8", R: "#e03131" }, 5);

    function criarMoedaPixelada(t) {
      const larguras = [8, 6, 4, 2, 4, 6];
      const linhas = [4, 6, 8, 8, 8, 8, 6, 4];
      const e = t / 8;
      const c = criarCanvas(t * larguras.length, t);
      const g = c.getContext("2d");

      larguras.forEach(function(w, f) {
        linhas.forEach(function(lw, y) {
          const l = Math.min(lw, w);
          const x = f * 8 + (8 - l) / 2;
          g.fillStyle = "#b8740a";
          g.fillRect(x * e, y * e, l * e, e);
          if (l >= 4 && y > 0 && y < 7) {
            g.fillStyle = "#ffcf2e";
            g.fillRect((x + 1) * e, y * e, (l - 2) * e, e);
          }
        });
        if (w >= 6) {
          g.fillStyle = "#fff3a0";
          g.fillRect((f * 8 + 2) * e, 2 * e, e, 2 * e);
        }
      });

      return c;
    }

    // Fonte da moeda: { img, fw, fh } (fw/fh = tamanho de cada quadro na imagem)
    let moedaFonte = { img: criarMoedaPixelada(MOEDA.tamanho), fw: MOEDA.tamanho, fh: MOEDA.tamanho };

    if (MOEDA.imagem) {
      const img = new Image();
      img.onload = function() {
        moedaFonte = { img: img, fw: img.naturalWidth / MOEDA.frames, fh: img.naturalHeight };
      };
      img.src = MOEDA.imagem;
    }

    // Fundo: imagem da selva pré-escalada; enquanto não carrega (ou sem internet) usa um fundo simples
    let fundo = criarFundoReserva();

    function criarFundoReserva() {
      const c = criarCanvas(LARGURA, ALTURA);
      const g = c.getContext("2d");
      const ceu = g.createLinearGradient(0, 0, 0, ALTURA);
      ceu.addColorStop(0, "#5fb8ff");
      ceu.addColorStop(1, "#c9f0ff");
      g.fillStyle = ceu;
      g.fillRect(0, 0, LARGURA, ALTURA);

      // Morros e árvores em blocos de 8px (se repetem a cada 1200px sem emenda)
      const camadas = [
        { cor: "#3f9142", base: 420, amp: 60, freq: 2 },
        { cor: "#2b6b2f", base: 520, amp: 50, freq: 5 }
      ];
      camadas.forEach(function(cam) {
        g.fillStyle = cam.cor;
        for (let x = 0; x < LARGURA; x += 8) {
          const a = x / LARGURA * Math.PI * 2 * cam.freq;
          const y = Math.round((cam.base - Math.abs(Math.sin(a)) * cam.amp) / 8) * 8;
          g.fillRect(x, y, 8, ALTURA - y);
        }
      });
      return c;
    }

    const imgFundo = new Image();
    imgFundo.onload = function() {
      const c = criarCanvas(LARGURA, ALTURA);
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = false;
      g.drawImage(imgFundo, 0, 0, LARGURA, ALTURA);
      fundo = c;
    };
    imgFundo.src = FUNDO_URL;


    // =========================
    // SAVE (moedas, compras e roupas equipadas ficam guardadas no navegador)
    // =========================

    function buscarItem(tipo, id) {
      const lista = tipo === "skin" ? SKINS : ITENS;
      return lista.find(function(i) { return i.id === id && (tipo === "skin" || i.tipo === tipo); }) || null;
    }

    function saveNovo() {
      return {
        moedas: 0,
        comprados: SKINS.filter(function(s) { return s.preco === 0; }).map(function(s) { return s.id; }),
        equip: { skin: SKINS[0].id, chapeu: null, oculos: null, roupa: null }
      };
    }

    let save = saveNovo();

    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (s && typeof s === "object") {
        if (typeof s.moedas === "number" && s.moedas >= 0) save.moedas = Math.floor(s.moedas);
        if (Array.isArray(s.comprados)) {
          s.comprados.forEach(function(id) {
            if (typeof id === "string" && save.comprados.indexOf(id) < 0) save.comprados.push(id);
          });
        }
        if (s.equip) {
          ["skin"].concat(CAMADAS).forEach(function(tipo) {
            const id = s.equip[tipo];
            if (id && buscarItem(tipo, id) && save.comprados.indexOf(id) >= 0) save.equip[tipo] = id;
          });
        }
      }
    } catch (e) { /* sem save: começa do zero */ }

    function salvar() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* navegador bloqueou */ }
    }


    // =========================
    // SPRITE DO MACACO (só é redesenhado quando troca skin/roupa)
    // =========================

    const imgPersonagem = new Image();
    let personagemOk = false;

    function desenharPrimata(g, equip, escala) {
      const tam = 20 * escala;
      g.imageSmoothingEnabled = false;
      g.clearRect(0, 0, tam, tam);

      const skin = buscarItem("skin", equip.skin) || SKINS[0];

      if (skin.imagem && personagemOk) {
        // Sua imagem, encaixada no quadrado sem esticar (igual object-fit: contain)
        const s = Math.min(tam / imgPersonagem.naturalWidth, tam / imgPersonagem.naturalHeight);
        const w = imgPersonagem.naturalWidth * s;
        const h = imgPersonagem.naturalHeight * s;
        g.drawImage(imgPersonagem, (tam - w) / 2, tam - h, w, h);
      } else {
        const cores = Object.assign({}, CORES_BASE, (skin.imagem ? buscarItem("skin", "classico") : skin).cores);
        pintarMapa(g, CORPO, cores, escala);
      }

      CAMADAS.forEach(function(tipo) {
        const item = equip[tipo] && buscarItem(tipo, equip[tipo]);
        if (item) pintarMapa(g, item.mapa, item.cores, escala, item.y);
      });
    }

    let spriteDireita = criarCanvas(80, 80);
    let spriteEsquerda = criarCanvas(80, 80);

    function montarSprite() {
      desenharPrimata(spriteDireita.getContext("2d"), save.equip, 4);

      const g = spriteEsquerda.getContext("2d");
      g.clearRect(0, 0, 80, 80);
      g.save();
      g.scale(-1, 1);
      g.drawImage(spriteDireita, -80, 0);
      g.restore();
    }

    if (IMAGEM_PERSONAGEM) {
      imgPersonagem.onload = function() {
        personagemOk = true;
        montarSprite();
        if (lojaAberta) renderizarLoja();
      };
      imgPersonagem.onerror = function() {
        // Imagem não encontrada: tira a skin "Original" e volta pro macaco pixelado
        SKINS.shift();
        if (save.equip.skin === "original") save.equip.skin = SKINS[0].id;
        montarSprite();
        if (lojaAberta) renderizarLoja();
      };
      imgPersonagem.src = IMAGEM_PERSONAGEM;
    }

    montarSprite();


    // =========================
    // ESTADO DO JOGO
    // =========================

    const canvas = document.getElementById("tela");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const larguraPrimata = 80;
    const alturaPrimata = 80;
    const chaoY = CHAO_Y - alturaPrimata;

    let faseAtual = 0;
    let moedasRodada = 0;
    let larguraMundo = 3000;
    let fim = 2800;
    let plataformas = [];
    let moedas = [];
    let textos = [];

    let mensagem = null;   // { texto, ate, depois }
    let lojaAberta = false;

    let posicaoX = 100;
    let altura = chaoY;
    let velocidadeX = 0;
    let velocidadeY = 0;
    let direcao = 1;
    let passos = 0;
    let noChao = true;
    let cameraX = 0;

    const velocidadeMaxima = 5;
    const aceleracao = 0.5;
    const desaceleracao = 0.7;
    const gravidade = 0.7;
    const forcaPulo = -14;

    let direita = false;
    let esquerda = false;
    let pulando = false;


    // =========================
    // CARREGAR FASE
    // =========================

    function carregarFase(n) {

      const f = fases[n];

      faseAtual = n;
      larguraMundo = f.largura;
      fim = f.fim;

      // Cada plataforma vira uma imagem pronta (1 desenho por quadro em vez de vários tiles)
      plataformas = f.plataformas.map(function(p) {
        const w = Math.max(32, Math.round(p[2] / 32) * 32);
        return { x: p[0], y: p[1], w: w, img: criarFaixa(w) };
      });

      moedas = f.moedas.map(function(m) {
        return { x: m[0], y: m[1], pega: false };
      });

      textos = [];

      // Personagem volta ao começo
      posicaoX = 100;
      altura = chaoY;
      velocidadeX = 0;
      velocidadeY = 0;
      direcao = 1;
    }

    function mostrarMensagem(texto, tempo, depois) {
      mensagem = { texto: texto, ate: performance.now() + tempo, depois: depois };
    }


    // =========================
    // TECLAS
    // =========================

    document.addEventListener("keydown", function(event) {

      const tecla = event.key.toLowerCase();

      if (event.key === " " || event.key.startsWith("Arrow")) {
        event.preventDefault();
      }

      if (tecla === "l") {
        if (lojaAberta) fecharLoja(); else abrirLoja();
        return;
      }

      if (lojaAberta) {
        if (event.key === "Escape") fecharLoja();
        return;
      }

      if (tecla === "d" || event.key === "ArrowRight") direita = true;
      if (tecla === "a" || event.key === "ArrowLeft") esquerda = true;

      if (
        (tecla === "w" || event.key === "ArrowUp" || event.key === " ") &&
        !pulando && !mensagem
      ) {
        velocidadeY = forcaPulo;
        pulando = true;
      }

    });

    document.addEventListener("keyup", function(event) {

      const tecla = event.key.toLowerCase();

      if (tecla === "d" || event.key === "ArrowRight") direita = false;
      if (tecla === "a" || event.key === "ArrowLeft") esquerda = false;

    });

    // Trocar de aba/janela solta as teclas (evita o macaco andar sozinho)
    window.addEventListener("blur", function() {
      direita = false;
      esquerda = false;
    });


    // =========================
    // FÍSICA (1 passo = 1/60 s)
    // =========================

    function atualizar() {

      // Aceleração horizontal
      if (direita) {
        velocidadeX = Math.min(velocidadeX + aceleracao, velocidadeMaxima);
      }
      else if (esquerda) {
        velocidadeX = Math.max(velocidadeX - aceleracao, -velocidadeMaxima);
      }
      else if (velocidadeX > 0) {
        velocidadeX = Math.max(velocidadeX - desaceleracao, 0);
      }
      else if (velocidadeX < 0) {
        velocidadeX = Math.min(velocidadeX + desaceleracao, 0);
      }

      if (velocidadeX > 0) direcao = 1;
      if (velocidadeX < 0) direcao = -1;

      posicaoX += velocidadeX;

      // Limites do mundo
      if (posicaoX < 0) {
        posicaoX = 0;
        velocidadeX = 0;
      }

      if (posicaoX > larguraMundo - larguraPrimata) {
        posicaoX = larguraMundo - larguraPrimata;
        velocidadeX = 0;
      }


      // Gravidade
      const alturaAnterior = altura;

      altura += velocidadeY;
      velocidadeY += gravidade;

      noChao = false;

      if (altura >= chaoY) {
        altura = chaoY;
        velocidadeY = 0;
        noChao = true;
      }


      // Plataformas (só pousa por cima)
      const pesAntes = alturaAnterior + alturaPrimata;
      const pesAgora = altura + alturaPrimata;

      for (let i = 0; i < plataformas.length; i++) {
        const p = plataformas[i];

        if (
          velocidadeY >= 0 &&
          posicaoX + larguraPrimata - 15 > p.x &&
          posicaoX + 15 < p.x + p.w &&
          pesAntes <= p.y &&
          pesAgora >= p.y
        ) {
          altura = p.y - alturaPrimata;
          velocidadeY = 0;
          noChao = true;
        }
      }

      pulando = !noChao;
      passos = noChao && velocidadeX !== 0 ? passos + 1 : 0;


      // Moedas
      for (let i = 0; i < moedas.length; i++) {
        const m = moedas[i];

        if (
          !m.pega &&
          posicaoX + larguraPrimata > m.x &&
          posicaoX < m.x + MOEDA.tamanho &&
          altura + alturaPrimata > m.y &&
          altura < m.y + MOEDA.tamanho
        ) {
          m.pega = true;
          save.moedas++;
          moedasRodada++;
          textos.push({ x: m.x, y: m.y, vida: 40 });
          salvar();
        }
      }

      for (let i = textos.length - 1; i >= 0; i--) {
        textos[i].y -= 1;
        if (--textos[i].vida <= 0) textos.splice(i, 1);
      }


      // Bandeira: fim da fase
      if (posicaoX + larguraPrimata > fim && posicaoX < fim + 40) {

        velocidadeX = 0;
        direita = false;
        esquerda = false;

        if (faseAtual < fases.length - 1) {
          mostrarMensagem("Fase " + (faseAtual + 1) + " completa!", 1500, function() {
            carregarFase(faseAtual + 1);
          });
        } else {
          mostrarMensagem("Você venceu!\n+" + moedasRodada + " moedas nesta rodada\nAperte L para ir à loja", 3500, function() {
            moedasRodada = 0;
            carregarFase(0);
          });
        }

      }


      // Câmera
      cameraX = posicaoX - 300;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > larguraMundo - LARGURA) cameraX = larguraMundo - LARGURA;
    }


    // =========================
    // DESENHO (só o que aparece na tela)
    // =========================

    function textoComSombra(texto, x, y) {
      ctx.fillStyle = "black";
      ctx.fillText(texto, x + 2, y + 2);
      ctx.fillStyle = "white";
      ctx.fillText(texto, x, y);
    }

    function desenhar(agora) {

      const cam = Math.round(cameraX);
      const direitaTela = cam + LARGURA;

      // Fundo com paralaxe (2 cópias lado a lado)
      const fx = Math.round(cam * PARALAXE) % LARGURA;
      ctx.drawImage(fundo, -fx, 0);
      ctx.drawImage(fundo, LARGURA - fx, 0);

      ctx.save();
      ctx.translate(-cam, 0);

      // Chão
      ctx.drawImage(FAIXA_CHAO, cam - (cam % 32), CHAO_Y);

      // Plataformas visíveis
      for (let i = 0; i < plataformas.length; i++) {
        const p = plataformas[i];
        if (p.x + p.w > cam && p.x < direitaTela) ctx.drawImage(p.img, p.x, p.y);
      }

      // Moedas visíveis (todas giram juntas)
      const t = MOEDA.tamanho;
      const quadro = Math.floor(agora / (800 / MOEDA.frames)) % MOEDA.frames;
      for (let i = 0; i < moedas.length; i++) {
        const m = moedas[i];
        if (!m.pega && m.x + t > cam && m.x < direitaTela) {
          ctx.drawImage(moedaFonte.img, quadro * moedaFonte.fw, 0, moedaFonte.fw, moedaFonte.fh, m.x, m.y, t, t);
        }
      }

      // Bandeira
      if (fim + 40 > cam && fim < direitaTela) ctx.drawImage(BANDEIRA, fim, chaoY);

      // Macaco (balança 4px enquanto anda)
      const balanco = Math.floor(passos / 8) % 2 ? -4 : 0;
      ctx.drawImage(direcao > 0 ? spriteDireita : spriteEsquerda, Math.round(posicaoX), Math.round(altura) + balanco);

      // "+1" das moedas
      ctx.font = "bold 20px monospace";
      ctx.textAlign = "left";
      for (let i = 0; i < textos.length; i++) {
        textoComSombra("+1", textos[i].x, textos[i].y);
      }

      ctx.restore();

      // HUD
      ctx.font = "bold 22px monospace";
      ctx.textAlign = "left";
      textoComSombra("Fase " + (faseAtual + 1) + "/" + fases.length, 20, 38);
      ctx.drawImage(moedaFonte.img, 0, 0, moedaFonte.fw, moedaFonte.fh, 20, 52, 28, 28);
      textoComSombra(String(save.moedas), 56, 74);

      // Mensagem
      if (mensagem) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, LARGURA, ALTURA);
        ctx.font = "bold 48px monospace";
        ctx.textAlign = "center";
        const linhas = mensagem.texto.split("\n");
        linhas.forEach(function(linha, i) {
          if (i === 1) ctx.font = "bold 30px monospace";
          textoComSombra(linha, LARGURA / 2, ALTURA / 2 - (linhas.length - 1) * 25 + i * 56);
        });
      }
    }


    // =========================
    // LOOP PRINCIPAL (passo fixo: mesma velocidade em 60Hz, 144Hz...)
    // =========================

    let ultimo = performance.now();
    let acumulado = 0;

    function quadro(agora) {

      let dt = agora - ultimo;
      ultimo = agora;
      if (dt > 100) dt = 100; // voltou de outra aba: não "pula" o tempo

      if (mensagem && agora >= mensagem.ate) {
        const depois = mensagem.depois;
        mensagem = null;
        depois();
      }

      if (mensagem || lojaAberta) {
        acumulado = 0;
      } else {
        acumulado += dt;
        while (acumulado >= PASSO) {
          atualizar();
          acumulado -= PASSO;
          if (mensagem) { acumulado = 0; break; }
        }
      }

      desenhar(agora);
      requestAnimationFrame(quadro);
    }


    // =========================
    // LOJA
    // =========================

    const lojaEl = document.getElementById("loja");
    const abasEl = document.getElementById("abas");
    const itensEl = document.getElementById("itens");
    const lojaMoedasEl = document.getElementById("lojaMoedas");
    const previaEl = document.getElementById("previa");
    let abaAtual = "skin";

    function abrirLoja() {
      if (mensagem) return;
      lojaAberta = true;
      direita = false;
      esquerda = false;
      lojaEl.classList.add("aberta");
      renderizarLoja();
    }

    function fecharLoja() {
      lojaAberta = false;
      lojaEl.classList.remove("aberta");
    }

    function renderizarLoja() {

      lojaMoedasEl.textContent = save.moedas;
      desenharPrimata(previaEl.getContext("2d"), save.equip, 8);

      abasEl.innerHTML = "";
      ABAS.forEach(function(aba) {
        const b = document.createElement("button");
        b.tabIndex = -1;
        b.textContent = aba.nome;
        b.dataset.aba = aba.tipo;
        if (aba.tipo === abaAtual) b.className = "ativa";
        abasEl.appendChild(b);
      });

      const lista = abaAtual === "skin" ? SKINS : ITENS.filter(function(i) { return i.tipo === abaAtual; });
      const frag = document.createDocumentFragment();

      lista.forEach(function(item) {
        const tem = save.comprados.indexOf(item.id) >= 0;
        const equipado = save.equip[abaAtual] === item.id;

        const card = document.createElement("div");
        card.className = "item" + (equipado ? " equipado" : "");

        // Prévia do macaco usando esse item junto com o resto que já está equipado
        const cv = criarCanvas(80, 80);
        const teste = Object.assign({}, save.equip);
        teste[abaAtual] = item.id;
        desenharPrimata(cv.getContext("2d"), teste, 4);
        card.appendChild(cv);

        const nome = document.createElement("div");
        nome.className = "nome";
        nome.textContent = item.nome;
        card.appendChild(nome);

        const preco = document.createElement("div");
        preco.className = "preco";
        if (tem) {
          preco.textContent = equipado ? "Equipado" : "Seu";
        } else {
          preco.innerHTML = '<span class="ic-moeda"></span>' + item.preco;
        }
        card.appendChild(preco);

        const b = document.createElement("button");
        b.tabIndex = -1;
        b.dataset.id = item.id;
        if (!tem) {
          b.textContent = save.moedas >= item.preco ? "Comprar" : "Faltam " + (item.preco - save.moedas);
          b.disabled = save.moedas < item.preco;
        } else if (equipado) {
          b.textContent = abaAtual === "skin" ? "Equipado" : "Tirar";
          b.disabled = abaAtual === "skin";
        } else {
          b.textContent = "Equipar";
        }
        card.appendChild(b);

        frag.appendChild(card);
      });

      itensEl.innerHTML = "";
      itensEl.appendChild(frag);
    }

    function usarItem(tipo, id) {
      const item = buscarItem(tipo, id);
      if (!item) return;

      if (save.comprados.indexOf(id) < 0) {
        if (save.moedas < item.preco) return;
        save.moedas -= item.preco;
        save.comprados.push(id);
        save.equip[tipo] = id;           // comprou, já veste
      } else if (save.equip[tipo] === id) {
        if (tipo !== "skin") save.equip[tipo] = null;  // tirar a roupa
      } else {
        save.equip[tipo] = id;
      }

      salvar();
      montarSprite();
      renderizarLoja();
    }

    abasEl.addEventListener("click", function(e) {
      const b = e.target.closest("button");
      if (!b) return;
      abaAtual = b.dataset.aba;
      renderizarLoja();
    });

    itensEl.addEventListener("click", function(e) {
      const b = e.target.closest("button");
      if (b && !b.disabled) usarItem(abaAtual, b.dataset.id);
    });

    document.getElementById("btnLoja").addEventListener("click", function() {
      this.blur();
      if (lojaAberta) fecharLoja(); else abrirLoja();
    });

    document.getElementById("fecharLoja").addEventListener("click", fecharLoja);


    // =========================
    // TELA: escala o jogo para caber na janela
    // =========================

    const jogoEl = document.getElementById("jogo");

    function ajustarTela() {
      const escala = Math.min(window.innerWidth / LARGURA, window.innerHeight / ALTURA);
      jogoEl.style.transform = "translate(-50%, -50%) scale(" + escala + ")";
    }

    window.addEventListener("resize", ajustarTela);
    ajustarTela();


    // Inicia o jogo
    carregarFase(0);
    requestAnimationFrame(quadro);

  </script>

</body>
