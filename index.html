<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo do Primata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <div id="jogo">

    <canvas id="tela" width="1200" height="700"></canvas>

    <div id="botoesJogo">
      <button data-acao="pausar">PAUSA (P)</button>
      <button data-acao="loja">LOJA (L)</button>
    </div>

    <!-- Menu inicial -->
    <div id="telaMenu" class="tela">
      <h1>Jogo do Primata</h1>
      <p class="sub">A grande caçada à banana</p>
      <p class="info"><span class="ic-moeda"></span><span id="menuMoedas">0</span> moedas · <span id="menuProgresso"></span></p>
      <div class="nivel">Nível <span id="menuNivel">1</span> <div class="barraXp"><div id="menuXp"></div></div></div>
      <div class="botoes">
        <button data-acao="jogar">Jogar (Enter)</button>
        <button data-acao="mapa">Escolher fase</button>
        <button data-acao="loja">Loja</button>
        <button data-acao="controles">Controles</button>
        <button data-acao="historia">Ver história</button>
      </div>
      <div class="controles" id="menuControles"></div>
    </div>

    <!-- Mapa de fases -->
    <div id="telaMapa" class="tela">
      <h2>Escolha a fase</h2>
      <div id="mundos"></div>
      <button data-acao="voltar">Voltar</button>
    </div>

    <!-- Pausa -->
    <div id="telaPausa" class="tela">
      <h2>Pausado</h2>
      <div class="botoes">
        <button data-acao="continuar">Continuar (P)</button>
        <button data-acao="loja">Loja (L)</button>
        <button data-acao="reiniciar">Recomeçar fase</button>
        <button data-acao="controles">Controles</button>
        <button id="btnSom" data-acao="som">Som</button>
        <button data-acao="menu">Menu principal</button>
      </div>
    </div>

    <!-- Controles: trocar as teclas -->
    <div id="telaControles" class="tela">
      <h2>Controles</h2>
      <p class="info">Clique numa tecla e aperte a nova. Delete apaga. Esc volta.</p>
      <div id="listaControles"></div>
      <div class="linhaBotoes">
        <button data-acao="padraoControles">Restaurar padrão</button>
        <button data-acao="fecharControles">Voltar</button>
      </div>
    </div>

    <!-- Loja -->
    <div id="loja">
      <div class="painel">
        <div class="topo">
          <h2>Loja do Primata</h2>
          <span class="saldo"><span class="ic-moeda"></span><span id="lojaMoedas">0</span></span>
          <span class="dica">L ou Esc para voltar</span>
          <button id="fecharLoja" tabindex="-1">X</button>
        </div>

        <div class="lado">
          <canvas id="previa" width="160" height="160"></canvas>
          <div class="abas" id="abas"></div>
        </div>

        <div class="itens" id="itens"></div>
      </div>
    </div>

  </div>

  <!-- A ordem importa: cada arquivo usa coisas dos anteriores -->
  <script src="js/util.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/save.js"></script>
  <script src="js/arte.js"></script>
  <script src="js/som.js"></script>
  <script src="js/fases.js"></script>
  <script src="js/jogo.js"></script>
  <script src="js/obstaculos.js"></script>
  <script src="js/progresso.js"></script>
  <script src="js/chefes.js"></script>
  <script src="js/cenas.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
