<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Jogo</title>
  <!-- SDK do Poki no <head>, como pede a documentação (sem ele o jogo funciona igual, só sem anúncios) -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="tela">
    <canvas id="canvas" width="1280" height="720"></canvas>

    <!-- HUD por cima do jogo -->
    <div id="hud" class="escondido">
      <button id="btnPausa" class="hudBotao" data-acao="pausar" aria-label="pause">II</button>
    </div>

    <!-- Menu principal -->
    <div id="telaMenu" class="tela">
      <h1 data-t="titulo"></h1>
      <div class="botoes">
        <button class="grande" data-acao="jogar" data-t="jogar"></button>
        <button data-acao="idiomas" data-t="idioma"></button>
        <button data-acao="som" id="btnSom"></button>
      </div>
      <p class="recorde" id="menuRecorde"></p>
    </div>

    <!-- Escolha do idioma (cada idioma com o nome na própria língua) -->
    <div id="telaIdiomas" class="tela">
      <h2 data-t="idioma"></h2>
      <div id="listaIdiomas"></div>
      <button data-acao="voltar" data-t="voltar"></button>
    </div>

    <!-- Pausa -->
    <div id="telaPausa" class="tela">
      <h2 data-t="pausado"></h2>
      <div class="botoes">
        <button class="grande" data-acao="continuar" data-t="continuar"></button>
        <button data-acao="som" id="btnSomPausa"></button>
        <button data-acao="menu" data-t="menu"></button>
      </div>
    </div>

    <!-- Fim de jogo, com a oferta opcional de continuar assistindo um anúncio -->
    <div id="telaFim" class="tela">
      <h2 data-t="fim"></h2>
      <p class="info" id="fimPontos"></p>
      <p class="info" id="fimRecorde"></p>
      <div class="botoes">
        <button class="premiado" data-acao="reviver" id="btnReviver" data-t="reviver"></button>
        <button class="grande" data-acao="denovo" data-t="denovo"></button>
        <button data-acao="menu" data-t="menu"></button>
      </div>
      <p class="aviso" id="fimAviso"></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/idiomas.js"></script>
  <script src="js/save.js"></script>
  <script src="js/poki.js"></script>
  <script src="js/eventos.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/entrada.js"></script>
  <script src="js/jogo.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
